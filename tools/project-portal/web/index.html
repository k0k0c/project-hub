  </head>
  <body>
    <a class="skip" href="#content" data-i18n="shell.skip">Перейти к содержимому</a>
    <aside class="sidebar">
      <details id="project-picker">
      <summary class="brand" aria-label="Выбрать проект" data-i18n-label="shell.chooseProject"
        ><svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 21h5V11h6v15h5V6h5v15h5" /></svg
        ><span><span id="project-name">Project Hub</span><small>PROJECT HUB<i class="project-chevron" aria-hidden="true"></i></small></span></summary
      >
      <div class="project-menu">
        <div id="project-options" aria-label="Проекты" data-i18n-label="shell.projects"></div>
        <small id="project-discovery" role="status"></small>
      </div>
      </details>
      <div class="nav-label" data-i18n="shell.workspace">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav id="navigation" aria-label="Разделы проекта" data-i18n-label="shell.sections"></nav>
      <div class="sidebar-bottom">
        <span class="local-mark"></span> <span data-i18n="shell.local">Локальный портал</span><small
          data-i18n="shell.history">История остаётся с проектом</small
        >
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div id="breadcrumb" data-i18n-initial="shell.breadcrumb">Проект / Обзор</div>
        <span id="hub-server-indicator" class="hub-server-indicator" role="status"></span>
        <div class="live-indicator" id="connection" role="status">
          <i></i><span data-i18n-initial="shell.connecting">Подключение…</span>
        </div>
      </header>
      <div id="backup-status" class="backup-status-banner" role="region" aria-label="Операции" hidden></div>
      <div id="alert" role="alert" hidden></div>
      <main id="content" tabindex="-1">
        <div class="loading" data-i18n="shell.loading">Загрузка проекта…</div>
      </main>
      <footer>
        <span data-i18n="shell.footer">Project Hub · Единый центр проекта</span
        ><span id="freshness" data-i18n-initial="shell.waiting">Ожидание данных</span>
      </footer>
    </div>
    <div
      id="announcement"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </body>
</html>
